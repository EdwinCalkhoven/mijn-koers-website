name: Koers bijwerken
on:
  schedule:
    - cron: '30 6,15 * * 1-5'   # werkdagen, 2x per dag (UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/koers.mjs
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "koers-bot"
          git config user.email "koers-bot@users.noreply.github.com"
          git add koers.json
          git diff --cached --quiet || (git commit -m "Koers bijgewerkt" && git push)
